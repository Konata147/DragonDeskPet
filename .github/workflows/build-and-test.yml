name: Build and smoke test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows .NET 8 verification
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore DragonDeskPet.sln

      - name: Build with zero warnings
        run: dotnet build DragonDeskPet.sln --configuration Debug --no-restore -warnaserror

      - name: Run smoke tests
        run: dotnet run --project tests/DragonDeskPet.SmokeTests/DragonDeskPet.SmokeTests.csproj --configuration Debug --no-build
